{% extends 'base.html' %}
{% block title %}Удалить {{ product.name }}{% endblock %}

{% block content %}
<div class="container my-5" style="max-width:500px;">
  <h2>Удалить «{{ product.name }}»?</h2>
  <p class="text-muted">Это действие нельзя отменить.</p>
  <form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Да, удалить</button>
    <a href="{% url 'menu:product_detail' product.pk %}" class="btn btn-secondary">Отмена</a>
  </form>
</div>
{% endblock %}
