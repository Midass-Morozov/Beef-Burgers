{% extends 'base.html' %}
{% block title %}Заказ оформлен{% endblock %}

{% block content %}
<div class="container my-5 text-center" style="max-width:600px;">
  <div class="display-1 text-success"><i class="bi bi-check-circle"></i></div>
  <h1 class="mt-3">Спасибо за заказ!</h1>
  <p class="fs-5">Номер заказа: <strong>#{{ order.pk }}</strong></p>
  <p class="fs-5">Сумма: <strong>{{ order.total }} ₽</strong></p>
  <p class="text-muted">Мы свяжемся с вами по телефону {{ order.phone }} для подтверждения.</p>
  <a href="{% url 'menu:index' %}" class="btn btn-warning fw-bold mt-3">На главную</a>
</div>
{% endblock %}
