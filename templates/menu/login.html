{% extends 'base.html' %}
{% block title %}Вход{% endblock %}

{% block content %}
<div class="container">
  <div class="auth-card">
    <h2><i class="bi bi-box-arrow-in-right"></i> Вход</h2>
    <form method="post">
      {% csrf_token %}
      {% for field in form %}
        <div class="mb-2">
          <label class="form-label fw-bold">{{ field.label }}</label>
          {{ field }}
          {% if field.errors %}
            <div class="text-danger small">{{ field.errors }}</div>
          {% endif %}
        </div>
      {% endfor %}
      <button type="submit" class="btn btn-mcd">Войти</button>
    </form>
    <p>Нет аккаунта? <a href="{% url 'menu:register' %}">Зарегистрироваться</a></p>
  </div>
</div>
{% endblock %}
