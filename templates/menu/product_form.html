{% extends 'base.html' %}
{% block title %}{{ action }} блюдо{% endblock %}

{% block content %}
<div class="container my-5">
  <h1>{{ action }} блюдо</h1>
  <form method="post" enctype="multipart/form-data" class="mt-4" style="max-width:600px;">
    {% csrf_token %}
    {% for field in form %}
    <div class="mb-3">
      <label class="form-label">{{ field.label }}</label>
      {{ field }}
      {% if field.errors %}<div class="text-danger small">{{ field.errors }}</div>{% endif %}
    </div>
    {% endfor %}
    <button type="submit" class="btn btn-warning fw-bold">{{ action }}</button>
    <a href="{% url 'menu:menu' %}" class="btn btn-secondary">Отмена</a>
  </form>
</div>
{% endblock %}
