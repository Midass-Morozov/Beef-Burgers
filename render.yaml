databases:
  - name: mcdonalds-db
    plan: free
    databaseName: mcdonalds
    user: mcdonalds

services:
  - type: web
    plan: free
    name: mcdonalds
    runtime: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn mcdonalds.wsgi:application"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: mcdonalds-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: WEB_CONCURRENCY
        value: 4